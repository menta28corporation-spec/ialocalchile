<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Videollamada Estratégica | IA Local Chile</title>
  <meta name="description" content="Agenda una videollamada estratégica de 15 minutos con Melissa Núñez Lagos de IA Local Chile. Automatización con IA para Pymes.">
  <link rel="canonical" href="https://ialocalchile.cl/agendar">
  
  <!-- OpenGraph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Agendar Videollamada Estratégica | IA Local Chile">
  <meta property="og:description" content="Agenda tu videollamada de 15 minutos con Melissa Núñez Lagos para implementar IA en tu Pyme.">
  <meta property="og:image" content="https://ialocalchile.cl/og-image.png">
  <meta property="og:url" content="https://ialocalchile.cl/agendar">

  <meta http-equiv="refresh" content="0; url=https://calendar.app.google/k1Hu8wGFyiWpxgQ6A">
  <style>
    body {
      background-color: #030712;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      font-weight: 700;
    }
    p {
      color: #9ca3af;
      font-size: 15px;
      margin-bottom: 20px;
    }
    a.btn {
      display: inline-block;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 4px 14px rgba(37,99,235,0.3);
    }
  </style>
  <script>
    try {
      if (navigator.sendBeacon) {
        navigator.sendBeacon("https://api.ialocalchile.cl/api/agendar-intent", JSON.stringify({ referrer: document.referrer || "direct" }));
      } else {
        fetch("https://api.ialocalchile.cl/api/agendar-intent", { method: "POST", mode: "no-cors" });
      }
    } catch(e) {}
    window.location.replace("https://calendar.app.google/k1Hu8wGFyiWpxgQ6A");
  </script>
</head>
<body>
  <div class="spinner"></div>
  <h1>Redirigiendo a la agenda oficial...</h1>

  <a class="btn" href="https://calendar.app.google/k1Hu8wGFyiWpxgQ6A">Hacer clic si no redirige automáticamente</a>
</body>
</html>
